name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ZXSofa-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica el APK en Releases para descargarlo directamente desde el móvil o la tele
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZXSofa.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ZXSofa.apk \
            --title "ZX Sofá (última versión)" \
            --notes "Compilación #${{ github.run_number }}. Descarga ZXSofa.apk e instálalo en el móvil, la tablet o la tele." \
            --target "${{ github.sha }}" --latest
