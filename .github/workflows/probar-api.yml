name: Probar API ZXInfo
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas
        run: |
          t() { curl -s -A "Mozilla/5.0 (Linux; Android 14) ZXSofa/1.0" -L -o /tmp/o -w "%{http_code} %{content_type} %{size_download} $1\n" "$1"; }
          t "https://api.zxinfo.dk/v3/search?query=jetpac&mode=compact&size=1"
          t "https://api.zxinfo.dk/v3/"
          t "https://spectrumcomputing.co.uk/pub/sinclair/games-inlays/s/SabreWulf_2.jpg"
          t "https://spectrumcomputing.co.uk/pub/sinclair/screens/load/s/scr/SabreWulf.scr"
          t "https://spectrumcomputing.co.uk/pub/sinclair/games-info/m/MonteCarlo.txt"
          t "https://spectrumcomputing.co.uk/zxdb/sinclair/entries/0003254/MonteCarlo.gif"
          t "https://spectrumcomputing.co.uk/zxdb/sinclair/pokes/s/Sabre%20Wulf%20(1984)(Ultimate%20Play%20The%20Game).pok"
          t "https://worldofspectrum.org/pub/sinclair/games-inlays/s/SabreWulf_2.jpg"
          t "https://www.worldofspectrum.org/pub/sinclair/games-inlays/s/SabreWulf_2.jpg"
          t "https://zxinfo.dk/media/pub/sinclair/games-inlays/s/SabreWulf_2.jpg"
          t "https://archive.org/download/World_of_Spectrum_June_2017_Mirror/World%20of%20Spectrum%20June%202017%20Mirror.zip/World%20of%20Spectrum%20June%202017%20Mirror%2Fsinclair%2Fgames-inlays%2Fs%2FSabreWulf_2.jpg"
