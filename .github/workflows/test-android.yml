name: Prueba en emulador Android
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            chmod +x gradlew
            adb logcat -c
            ./gradlew connectedDebugAndroidTest || true
            adb logcat -d -s ZXSofaTest:V AndroidRuntime:E TestRunner:V | tail -80
            adb logcat -d -v raw -s ZXSofaShot:I > shots.txt; wc -c shots.txt; cat shots.txt
